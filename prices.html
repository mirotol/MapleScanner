<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Database</title>
<link rel="stylesheet" href="theme.css">
<style>
  main { padding: 0 24px 32px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { main { padding: 0 16px 16px; } }
  .quiet { color: var(--mist); }
  /* clip, not auto: a box that scrolls sideways would hold the column headers, so they'd scroll
     away. Only a window too narrow for the columns scrolls them sideways, without sticking. */
  .wrap { overflow-x: clip; }
  table { border-collapse: collapse; width: 100%; }
  /* headers are small capitals, so the rows lead; only the sorted one is orange */
  th { text-align: left; color: var(--mist); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; padding: 6px 10px; }
  td { padding: 7px 10px; border-top: 1px solid var(--dusk); }
  .num { text-align: right; white-space: nowrap; }

  /* ---------- top: search and tabs ----------
     One slim bar that stays at the top while the list scrolls, with the column headers stuck
     under it (top: --bar-h, set by prices.js), so a number deep in the list still says what it
     is, and search, tabs and sorting stay in reach. It stays put rather than hiding on the way
     down, and one scrollbar moves the page: a list scrolling in a box of its own would be a
     second scroll area inside the Prices frame. */
  .topbar { position: sticky; top: 0; z-index: 2; background: var(--night); padding: 14px 0 6px; }
  .topbar-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 20px; }
  /* The search box has its own clear button: the browser's own was missing on phones (Safari
     shows none) and tiny elsewhere, so it's hidden for one look everywhere. */
  .search { position: relative; flex: 1 1 260px; max-width: 440px; margin-bottom: 7px; }
  .search input { width: 100%; font-size: 15px; padding: 8px 40px 8px 12px; border-radius: 8px; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search .clear { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 6px; box-shadow: none; background: none; color: var(--mist); }
  .search .clear:hover { background: var(--ridge); color: var(--cloud); }
  .search .clear svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .search .clear[hidden] { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips + .chips { margin-top: 6px; }
  .chips:empty { display: none; }
  .chip { font: 600 13px/18px var(--display); padding: 4px 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--ridge); }
  .chip small { font: 500 12px var(--text); color: var(--mist); margin-left: 3px; }
  .chip.on, .chip.on:hover { background: none; color: var(--meso-text); box-shadow: inset 0 0 0 1.5px var(--meso); }
  .chip.on small { color: var(--meso-text); }
  .chips.groups .chip { font-size: 12px; font-weight: 500; padding: 2px 9px; }
  .chips.groups .chip.on { font-weight: 600; }
  /* the game's inventory tabs: plain words, an orange line under the chosen one */
  .chips.tabs { gap: 2px; }
  .topbar-row + .chips { margin-top: 8px; }
  .chips.tabs .chip { color: var(--mist); box-shadow: none; border-radius: 0; padding: 6px 12px 8px; margin-bottom: -1px; border-bottom: 2px solid transparent; }
  .chips.tabs .chip:hover { background: none; color: var(--cloud); }
  .chips.tabs .chip.on, .chips.tabs .chip.on:hover { color: var(--cloud); box-shadow: none; border-bottom-color: var(--meso); }
  .chips.tabs .chip.on small { color: var(--mist); }
  /* Hide ●○○: one switch at the bar's right end, with the dots as the column shows them. No count:
     the tabs already count what it leaves. A smaller switch than Settings', to sit in the slim bar. */
  .surepick { margin: 0 0 8px auto; display: flex; align-items: center; gap: 8px; font: 600 13px/18px var(--display); color: var(--mist); white-space: nowrap; cursor: pointer; }
  .surepick:hover { color: var(--cloud); }
  .surepick .dots { margin: 0; }
  .surepick input[role="switch"] { width: 32px; height: 18px; }
  .surepick input[role="switch"]::before { top: 2px; left: 2px; width: 14px; height: 14px; }
  .surepick input[role="switch"]:checked::before { transform: translateX(14px); }
  /* in the bar, so a result shows wherever the list is scrolled to */
  .note { color: var(--sky); font-size: 13px; margin: 6px 0 0; }
  .note:empty { display: none; }

  /* ---------- the item list ---------- */
  #list tr.item { cursor: pointer; }
  /* the headers' own line is above the first item, so it doesn't get a second one */
  #list tr:first-child + tr.item td { border-top: 0; }
  #list tr.item:hover { background: var(--dusk); }
  /* the item: a bigger icon beside its name, with what kind of item it is under the name */
  #list .item-name { font-weight: 700; min-width: 180px; }
  #list .item-name .named { align-items: center; }
  #list .item-name .icon { width: 32px; height: 32px; margin: 0 10px 0 0; }
  #list .item-name .name { display: block; }
  #list .kind { display: block; color: var(--mist); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  /* a header sorts the list by its column: it looks like the header, with an arrow when sorted */
  /* tucked 1px under the bar, which is drawn on top, so rounding at a zoomed text size leaves no gap */
  #list th { padding: 0; position: sticky; top: calc(var(--bar-h, 0px) - 1px); z-index: 1; background: var(--night); box-shadow: inset 0 -1px 0 var(--dusk); }
  #list .colsort { font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; box-shadow: none; border-radius: 0; width: 100%; text-align: inherit; padding: 6px 10px; white-space: nowrap; }
  #list .colsort:hover { background: none; color: var(--cloud); }
  #list th.sorted { color: var(--meso-text); }
  #list .colsort .arrow { display: inline-block; width: 1em; text-align: center; }
  #list .usual b { font-size: 15px; }
  /* Price confidence: dots and what decided them, in the muted colour so the prices lead */
  #list td.sure { white-space: nowrap; font-size: 13px; color: var(--mist); }
  /* the price ends on the right and the dots start on the left, so without room the dots read
     as part of the number. The header's button moves over with them. */
  #list td.sure, #list th.sure .colsort { padding-left: 28px; }
  #list td span.under { display: block; font-size: 12px; color: var(--mist); }
  #list td span.under.go { color: var(--sky); font-weight: 600; }
  .empty { padding: 28px; text-align: center; color: var(--mist); }
  @media (max-width: 760px) { #list .wide { display: none; } }
  /* On a phone each item is two lines, like a phone's price lists (CoinMarketCap, Apple Stocks):
     the icon, name and kind on the left, and on the right the usual price with the confidence
     dots and the cheapest ask under it. When it was last seen goes after the kind. The other
     columns and their headers are hidden, so nothing scrolls sideways (before Nov 11 the
     columns after the usual price were off the screen's edge), and a sort menu in the bar
     takes the headers' place. */
  #list td span.phone, .sortpick { display: none; }
  .sortpick { align-items: center; gap: 6px; margin-bottom: 8px; font: 600 13px/18px var(--display); color: var(--mist); }
  .sortpick select { font-size: 13px; padding: 4px 8px; }
  .sortpick button { width: 30px; height: 28px; padding: 0; font-size: 15px; }
  @media (max-width: 560px) {
    .sortpick { display: flex; }
    #list tr.head, #list td.sure, #list td.ask, #list td.seen { display: none; }
    #list td span.phone { display: inline; }
    #list span.phone.under { display: flex; justify-content: flex-end; align-items: center; margin-top: 2px; white-space: nowrap; }
    #list .item-name { min-width: 0; padding-left: 0; }
    #list td.usual { padding-right: 0; vertical-align: top; padding-top: 10px; }
  }

  /* ---------- the item card: a big panel over the list ----------
     The list stays still under an open card: the page stops scrolling, and the card's own
     scrolling doesn't run on into the page at its ends. The scrollbar's room stays reserved,
     so the list doesn't jump sideways when it goes. */
  html { scrollbar-gutter: stable; }
  html:has(dialog.card[open]) { overflow: hidden; }
  dialog.card { width: min(1040px, calc(100vw - 32px)); max-width: none; height: calc(100vh - 32px); max-height: none; padding: 0; background: var(--night); border-radius: 12px; overflow: hidden; }
  dialog.card[open] { display: flex; flex-direction: column; }
  .card p { margin: 0; color: inherit; font-size: inherit; }
  .card-head { flex: none; background: var(--dusk); padding: 16px 20px 14px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-start; position: relative; }
  .card-head .who { display: flex; gap: 12px; align-items: center; flex: 1 1 240px; min-width: 0; padding-right: 36px; }
  .card-head .who .icon { width: 44px; height: 44px; margin: 0; flex: none; }
  .card-head h2 { font-size: 24px; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
  .card-head .who p { color: var(--mist); font-size: 13px; }
  .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 1; }
  .figures { display: flex; flex-wrap: wrap; gap: 8px 28px; flex: 10 1 520px; }
  .fig > span { display: block; font-size: 12.5px; color: var(--mist); white-space: nowrap; }
  .fig b { display: block; font-size: 24px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .fig b .tag { display: inline; margin-left: 6px; vertical-align: 4px; }
  .fig > span.go { color: var(--sky); font-weight: 600; }
  .fig.main b { font-size: 28px; }
  /* Price confidence: smaller than a price, on the same line height, and its reasoning wraps */
  .fig.sure b { font-size: 17px; font-weight: 600; line-height: 34px; color: var(--mist); }
  .fig.sure .dots { gap: 4px; margin-right: 7px; }
  .fig.sure .dots i { width: 10px; height: 10px; box-shadow: inset 0 0 0 2px var(--ridge); }
  .fig.sure .dots i.on { box-shadow: none; }
  .fig.sure > span.why { white-space: normal; max-width: 280px; }
  .fig b.dim { color: var(--mist); font-size: 18px; font-weight: 600; line-height: 1.55; }
  .card-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 20px 20px; }
  .card-note { min-height: 0; }

  .card-controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .card-controls .spacer { flex: 1; }
  .seg { display: inline-flex; background: var(--dusk); border-radius: 16px; padding: 2px; }
  .seg button { font: 600 13px/18px var(--display); padding: 4px 11px; border-radius: 14px; box-shadow: none; }
  .seg button.on, .seg button.on:hover { background: var(--night); color: var(--cloud); box-shadow: 0 1px 2px var(--shade); }
  .statpop { position: relative; }
  .statbtn { font: 600 13px/18px var(--display); padding: 5px 12px; }
  .statbtn.on { box-shadow: inset 0 0 0 2px var(--sky); color: var(--sky); }
  .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 2; width: 280px; background: var(--night); border-radius: 10px; box-shadow: 0 0 0 1px var(--ridge), 0 8px 24px var(--shade); padding: 12px 14px; }
  .pop[hidden] { display: none; }
  .pop label.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; padding-bottom: 10px; border-bottom: 1px solid var(--dusk); margin-bottom: 8px; cursor: pointer; }
  .pop label.toggle small { display: block; font-weight: 500; font-size: 12px; color: var(--mist); }
  .pop .range { display: grid; grid-template-columns: 1fr 64px 10px 64px; gap: 6px; align-items: center; font-size: 13px; padding: 3px 0; }
  .pop .range input { width: 64px; padding: 4px 6px; text-align: center; }
  .pop .range i { color: var(--mist); font-style: normal; text-align: center; }
  .pop .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--mist); }
  .pop .foot button { padding: 3px 10px; font-size: 13px; }
  .left-out { color: var(--ember); font-size: 13px; margin-top: 10px; }

  .chart { margin-top: 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--dusk); padding: 8px 10px 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--mist); padding: 0 4px; }
  .legend i { display: inline-block; vertical-align: -1px; margin-right: 5px; }
  .legend .l-ask { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--sky); }
  .legend .l-sold { width: 8px; height: 8px; background: var(--meso); transform: rotate(45deg); }
  .legend .l-usual { width: 16px; border-top: 2px dashed var(--cloud); vertical-align: 3px; }
  .legend .l-npc { width: 16px; border-top: 2px dotted var(--exp); vertical-align: 3px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart text { font: 500 11px var(--text); fill: var(--mist); }
  .chart .grid { stroke: var(--dusk); }
  .chart .ask { fill: var(--night); stroke: var(--sky); stroke-width: 1.8; }
  .chart .sold { fill: var(--meso); }
  .chart .usual { stroke: var(--cloud); stroke-dasharray: 6 4; stroke-width: 1.5; }
  .chart .npc { stroke: var(--exp); stroke-dasharray: 2 3; stroke-width: 1.5; }
  .chart .over { fill: var(--hp); }
  .chart .grid.day { stroke-dasharray: 2 4; }
  .chart .dense .ask { stroke-width: 1.4; opacity: 0.6; }
  .chart .dense .sold { opacity: 0.7; }
  .chart .trend { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .chart .trend.sold { stroke: var(--meso); }
  .chart .trend.ask { stroke: var(--sky); }
  .chart .trend-dot.sold { fill: var(--meso); }
  .chart .trend-dot.ask { fill: var(--sky); }
  .legend .l-trend { width: 16px; border-top: 2px solid; vertical-align: 3px; }
  .legend .l-trend.sold { border-color: var(--meso); }
  .legend .l-trend.ask { border-color: var(--sky); }
  .chart-empty { padding: 50px 0; text-align: center; color: var(--mist); font-size: 13px; }

  .rows-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 18px 0 4px; }
  .rows-head h3 { font-size: 16px; margin: 0; }
  .rows-head span { color: var(--mist); font-size: 13px; }
  .rows th.sortable { cursor: pointer; }
  .rows th.sortable:hover { color: var(--cloud); }
  .rows th.sorted { color: var(--meso-text); }
  .rows td { font-size: 13.5px; padding: 6px 10px; }
  .rows td.when { color: var(--mist); white-space: nowrap; }
  .rows td.where { color: var(--sky); font-weight: 600; white-space: nowrap; }
  .rows td.where.unknown { color: var(--mist); font-weight: 500; }
  .rows td.seller small { display: block; color: var(--mist); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .rows td.price { font-weight: 700; font-size: 14.5px; }
  .rows td.price small { display: block; font-weight: 500; font-size: 12px; color: var(--mist); }
  .rows tr.sold td { color: var(--mist); }
  .rows tr.sold td.price { font-weight: 600; }
  .badge { font: 600 11px/16px var(--display); padding: 0 6px; border-radius: 4px; background: var(--dusk); color: var(--mist); margin-right: 6px; vertical-align: 1px; }
  .stat { display: inline-block; font-size: 12px; background: var(--dusk); border-radius: 4px; padding: 0 6px; margin: 1px 4px 1px 0; white-space: nowrap; }
  .stat .up { color: var(--exp); font-weight: 700; }
  .stat .down { color: var(--hp); font-weight: 700; }
  .more { margin-top: 10px; }
</style>
</head>
<body>
<main>
  <div class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="search"><input id="search" type="search" placeholder="Search items..." aria-label="Search items"><button type="button" class="clear" id="clearSearch" aria-label="Clear search" title="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="chips tabs" id="tabs"></div>
      <div class="sortpick"><label for="sortPick">Sort</label><select id="sortPick"></select><button type="button" id="sortWay"></button></div>
      <label class="surepick level1" title="Hides prices with low confidence: under 5 sellers, or sellers far apart.">Hide <span class="dots" role="img" aria-label="low confidence"><i class="on"></i><i></i><i></i></span><input type="checkbox" role="switch" id="hideThin" aria-label="Hide prices with low confidence"></label>
    </div>
    <div class="chips groups" id="groups"></div>
    <p class="note" id="note" role="status"></p>
  </div>
  <div class="wrap"><table id="list"></table></div>
</main>
<dialog class="card" id="card" aria-label="Item prices"></dialog>
<script src="pricing.js"></script>
<script src="market.js"></script>
<script src="prices.js"></script>
</body>
</html>
