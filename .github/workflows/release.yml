name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and uploads it to a draft GitHub release.
# Nothing reaches players until the draft is published by hand on GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      # Every release has notes written for players, checked before the slow build.
      - name: Release notes exist
        shell: bash
        run: |
          notes="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes: write the release notes for players before tagging"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run dist
      # Uploaded with gh rather than electron-builder's publisher: on v0.1.0 that one started two
      # uploads at once, created the release twice and exited with success after only the
      # blockmap was up, leaving no installer and no latest.yml. gh fails the job if any file fails.
      - name: Upload to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(dist/MapleScanner-Setup-*.exe dist/MapleScanner-Setup-*.exe.blockmap dist/latest.yml)
          notes="release-notes/${GITHUB_REF_NAME#v}.md"
          ls -l "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file "$notes"
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
